<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>File not found</title>
<script>
// Old file name -> new location. One line per renamed or withdrawn file.
// A plain file name means a file in this repo (/articles/); a full address (https://...) is used as it stands.
// Old names are matched exactly, after %20 etc. are decoded.
var MOVED = {
  "Frankish_What is illusionism_eprint.pdf": "http://www.revue-klesis.org/pdf/klesis-55-04-keith-frankish-what-is-illusionism.pdf",
  "Frankish_Illusionism as a theory of consciousness_eprint.pdf": "Frankish_2016_Illusionism_as_a_theory_of_consciousness_eprint.pdf",
  "Frankish_Not disillusioned_eprint.pdf": "Frankish_2016_Not_disillusioned_eprint.pdf",
  "Frankish_Inner speech and outer thought_eprint.pdf": "Frankish_2018_Inner_speech_and_outer_thought_eprint.pdf",
  "Frankish_Dennett's dual-process theory_eprint.pdf": "Frankish_2015_Dennetts_dual-process_theory_eprint.pdf",
  "Frankish_A diet but not the Qualia Plan_eprint.pdf": "Frankish_2012_A_diet_but_not_the_qualia_plan_eprint.pdf",
  "Frankish_Quining diet qualia_eprint.pdf": "Frankish_2012_Quining_diet_qualia_eprint.pdf",
  "Frankish_What_are_LLMs_doing_eprint.pdf": "Frankish_2024_What_are_large_language_models_doing.pdf",
  "Frankish_2024_What are large language models doing.pdf": "Frankish_2024_What_are_large_language_models_doing.pdf",
  "Frankish_Dual systems and dual attitudes_eprint.pdf": "Frankish_2012_Dual_systems_and_dual_attitudes_eprint.pdf",
  "Frankish_Evolving linguistic mind_eprint.pdf": "Frankish_2010_Evolving_the_linguistic_mind_eprint.pdf",
};
(function () {
  var base = "/articles/";
  var path = window.location.pathname;
  var name = path.substring(path.lastIndexOf("/") + 1);
  try { name = decodeURIComponent(name); } catch (e) {}
  if (Object.prototype.hasOwnProperty.call(MOVED, name)) {
    var target = MOVED[name];
    if (!/^https?:\/\//.test(target)) {
      target = base + encodeURIComponent(target);
    }
    window.location.replace(target);
  }
})();
</script>
<style>
  body { font-family: Georgia, "Times New Roman", serif; color: #333; background: #fefdfb;
         max-width: 36em; margin: 4em auto; padding: 0 16px; line-height: 1.5; font-size: 18px; }
  h1 { font-weight: normal; font-size: 1.4em; }
  a { color: #2563a8; }
</style>

<p>There is no file at this address. It may have been renamed or withdrawn.</p>
